version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tiki_postgres
    environment:
      POSTGRES_DB: tikitecha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: